plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.7'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'checkstyle'
    id 'com.github.spotbugs' version "6.4.2"
	id 'com.google.protobuf' version '0.9.4'
}

group = 'com.bugmaker'
version = '0.0.1-SNAPSHOT'
description = '아파트 프로젝트'

checkstyle {
    toolVersion = '10.12.4'
    ignoreFailures = true
}

// 테스트 Java 소스 컴파일 비활성화
tasks.named('compileTestJava') {
	enabled = false
}

// 테스트 리소스 처리 비활성화 (선택 사항이지만 깔끔합니다)
tasks.named('processTestResources') {
	enabled = false
}

// ===== 테스트 비활성화 =====
tasks.named("test") {
	enabled = false
}

tasks.named("check") {
	enabled = false
}

// ===== SpotBugs 비활성화 =====
tasks.named("spotbugsMain") {
	enabled = false
}

tasks.named("spotbugsTest") {
	enabled = false
}

// ===== Checkstyle: test 제외, main만 검사 =====
tasks.named("checkstyleTest") {
	enabled = false
}

tasks.named("checkstyleMain") {
	enabled = false
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

// ===== Protobuf 설정 추가 =====
protobuf {
	protoc {
		artifact = 'com.google.protobuf:protoc:3.24.0'
	}
	plugins {
		grpc {
			artifact = 'io.grpc:protoc-gen-grpc-java:1.59.0'
		}
	}
	generateProtoTasks {
		all().each { task ->
			task.plugins {
				grpc {}
			}
		}
	}
}

// ===== Protobuf 생성 파일을 소스로 인식 =====
sourceSets {
	main {
		java {
			srcDirs 'build/generated/source/proto/main/grpc'
			srcDirs 'build/generated/source/proto/main/java'
		}
	}
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter'
	implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    runtimeOnly 'org.springframework.boot:spring-boot-docker-compose'
    runtimeOnly 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	// Lombok
    implementation 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

	// JPA
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	
	// PostgreSQL
	runtimeOnly 'org.postgresql:postgresql'

	// OAuth2 Client
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
	
	// JWT
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
	
	// Security
	implementation 'org.springframework.boot:spring-boot-starter-security'
    testImplementation 'org.springframework.security:spring-security-test'

	// Swagger (SpringDoc OpenAPI)
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.7.0'

	// gRPC (dev/prod 환경용)
	implementation 'net.devh:grpc-server-spring-boot-starter:3.1.0.RELEASE'
// grpc-server-spring-boot-starter가 버전 관리하도록 명시적 버전 제거 (gRPC 라이브러리 버전이 Docker와 불일치 하는 현상이 발생. 둘다 맞추던가)
// implementation 'io.grpc:grpc-stub:1.59.0'
// implementation 'io.grpc:grpc-protobuf:1.59.0'
// implementation 'io.grpc:grpc-netty-shaded:1.59.0'
// implementation 'com.google.protobuf:protobuf-java:3.24.0'

	// javax.annotation (Java 11+에서 필요)
	implementation 'javax.annotation:javax.annotation-api:1.3.2'
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.withType(Checkstyle).configureEach {
    reports {
        xml.required = false
		html.required = true
    }
}

test {
    jvmArgs "-javaagent:${configurations.testRuntimeClasspath.find { it.name.contains('mockito-core') }}", '-Xshare:off'
}

spotbugs {
    excludeFilter.set(file("${projectDir}/spotbugs-exclude-filter.xml"))
}
