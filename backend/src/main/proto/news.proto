syntax = "proto3";

option java_package = "com.bugmaker.apt.grpc.proto";
option java_outer_classname = "NewsProto";

package news;

// 뉴스 생성 요청
message NewsCreateRequest {
  string title = 1;
  string content = 2;
  string reference = 3;
  string category = 4;
  string thumbnail_url = 5;
  string detail_image_url = 6;
}

// 뉴스 응답
message NewsResponse {
  int64 id = 1;
  string title = 2;
  string reference = 3;
  string category = 4;
  int64 view_count = 5;
  int64 heart_count = 6;
  int64 share_count = 7;
  int64 report_count = 8;
  string created_date = 9;
}

// 카테고리 정보
message CategoryInfo {
  string code = 1;              // REAL_ESTATE
  string display_name = 2;      // 화면 표시명 ("부동산", "정책" 등)
  repeated string keywords = 3; // 키워드 목록
}

// 카테고리 목록 응답
message GetCategoriesResponse {
  repeated CategoryInfo categories = 1;
}

// 카테고리 분류 요청
message ClassifyRequest {
  string title = 1;
  string content = 2;
}

// 카테고리 분류 응답
message ClassifyResponse {
  string category = 1;  // displayName (예: "부동산", "정책", "일반")
}

// 빈 요청
message Empty {}

// 뉴스 서비스
service NewsService {
  rpc CreateNews(NewsCreateRequest) returns (NewsResponse);
  rpc GetCategories(Empty) returns (GetCategoriesResponse);
  rpc ClassifyCategory(ClassifyRequest) returns (ClassifyResponse);  // 카테고리 분류 (가중치 기반)
}
