# RSS 뉴스 출처 설정
# content:encoded 제공하는 언론사 중심

rss_sources:
  # SBS 뉴스 (전체 본문 제공 )
  - name: "SBS 정치"
    url: "https://news.sbs.co.kr/news/SectionRssFeed.do?sectionId=01"
    category: "정치"
    enabled: true
    
  - name: "SBS 경제"
    url: "https://news.sbs.co.kr/news/SectionRssFeed.do?sectionId=02"
    category: "경제"
    enabled: true
    
  - name: "SBS 사회"
    url: "https://news.sbs.co.kr/news/SectionRssFeed.do?sectionId=07"
    category: "사회"
    enabled: true

# 크롤링 설정
# 키워드는 Backend의 NewsCategory Enum에서 자동으로 가져옴
crawler:
  duplicate_check_days: 7
  request_delay: 0  # RSS만 사용하니 delay 불필요!
  max_news_per_run: 50
