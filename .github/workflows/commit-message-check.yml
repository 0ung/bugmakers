name: Commit message check

on:
  push:
    branches:
      - "feat/**"

jobs:
  check-commit-message:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 전체 히스토리 필요

      - name: Validate commit messages
        run: |
          echo "🔍 Checking commit messages..."

          bad_commit=false

          # 제목 패턴: [TYPE] 제목
          pattern="^\[(ADD|UPDATE|FIX|DELETE|REFACTOR|TEST|DOCS|CHORE)\][[:space:]]?.+"

          for commit in $(git rev-list ${{ github.event.before }}..${{ github.event.after }}); do
            msg=$(git log --format=%s -n 1 $commit)
            body=$(git log --format=%b -n 1 $commit)

            echo "➡ Checking: $msg"

            # 0) Merge Commit은 검사 제외
            if echo "$msg" | grep -Eq "^Merge "; then
              echo "ℹ️ Merge commit → skip"
              continue
            fi

            # 1) 제목 검사
            if ! echo "$msg" | grep -Eq "$pattern"; then
              echo "❌ 제목 형식이 올바르지 않습니다: $msg"
              bad_commit=true
            fi

            # 2) 본문은 선택 사항.  
            # 본문이 있으면 bullet 형식만 확인
            if [ -n "$body" ] && ! echo "$body" | grep -q "^-"; then
              echo "❌ Body는 '-' 로 시작해야 합니다."
              bad_commit=true
            fi
          done

          if [ "$bad_commit" = true ]; then
            echo "❌ Commit message does NOT follow the team convention."
            exit 1
          else
            echo "✅ All commit messages follow the format."
          fi

