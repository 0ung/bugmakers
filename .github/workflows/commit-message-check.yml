name: Commit message check

on:
  push:
    branches:
      - "feat/**"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Validate Push Commits
        run: |
          # 1. 이번 Push의 범위(Range) 구하기
          if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            git fetch origin main
            range="origin/main..HEAD"  # 새 브랜치면 main 이후 변경분만
          else
            range="${{ github.event.before }}..${{ github.event.after }}" # 기존 브랜치면 업데이트된 구간만
          fi

          # 2. 해당 범위의 커밋만 추출
          commits=$(git log --no-merges --format="%H" $range)
          if [ -z "$commits" ]; then exit 0; fi

          # 3. 검사 시작
          error=false
          pattern="^\[(ADD|UPDATE|FIX|DELETE|REFACTOR|TEST|DOCS|CHORE)\] .+"

          for commit in $commits; do
            msg=$(git log -1 --format=%s $commit)
            body=$(git log -1 --format=%b $commit)

            if ! echo "$msg" | grep -Eq "$pattern"; then
              echo "❌ [제목 위반] $msg"
              error=true
            fi

            if [ -n "$body" ] && ! echo "$body" | grep -q "^-"; then
              echo "❌ [본문 위반] $msg (본문은 '- '로 시작 필수)"
              error=true
            fi
          done

          if [ "$error" = true ]; then exit 1; fi
