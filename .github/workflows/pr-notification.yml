name: Repo Notifications

on:
  # 모든 push 이벤트
  push:
    branches:
      - "**"

  # 모든 PR 이벤트
  pull_request:
    types: [opened, closed, reopened, review_requested]
  pull_request_review:
    types: [submitted]

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:

      # -----------------------------
      # 1) PUSH 알림
      # -----------------------------
      - name: Notify on Push
        if: github.event_name == 'push'
        uses: tsickert/discord-webhook@v5.3.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK }}
          embed-title: "📦 New Push to `${{ github.ref_name }}`"
          embed-description: |
            **Pusher:** ${{ github.actor }}
            **Branch:** `${{ github.ref_name }}`
            **Commit Message:** ${{ github.event.head_commit.message }}
            **Diff:** https://github.com/${{ github.repository }}/commit/${{ github.sha }}

            @devops Updated code pushed.
          embed-color: 15105570


      # -----------------------------
      # 2) PR Open 알림
      # -----------------------------
      - name: Notify on PR Opened
        if: github.event_name == 'pull_request' && github.event.action == 'opened'
        uses: tsickert/discord-webhook@v5.3.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK }}
          embed-title: "🔔 New Pull Request Opened"
          embed-description: |
            **Title:** ${{ github.event.pull_request.title }}
            **Author:** ${{ github.event.pull_request.user.login }}
            **Branch:** `${{ github.head_ref }}`
            **Link:** ${{ github.event.pull_request.html_url }}

            @devops Please review!
          embed-color: 3447003


      # -----------------------------
      # 3) PR Approved (Review Submitted)
      # -----------------------------
      - name: Notify on PR Approved
        if: github.event_name == 'pull_request_review' && github.event.review.state == 'approved'
        uses: tsickert/discord-webhook@v5.3.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK }}
          embed-title: "📝 PR Approved"
          embed-description: |
            **Reviewer:** ${{ github.event.review.user.login }}
            **Title:** ${{ github.event.pull_request.title }}
            **Branch:** `${{ github.event.pull_request.head.ref }}`
            **Link:** ${{ github.event.pull_request.html_url }}

            Approved and ready for merge.
          embed-color: 8311585


      # -----------------------------
      # 4) PR Merged 알림
      # -----------------------------
      - name: Notify on PR Merged
        if: github.event_name == 'pull_request' && github.event.pull_request.merged == true
        uses: tsickert/discord-webhook@v5.3.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK }}
          embed-title: "✅ Pull Request Merged"
          embed-description: |
            **Title:** ${{ github.event.pull_request.title }}
            **Merged by:** ${{ github.event.pull_request.merged_by.login }}
            **Branch:** `${{ github.head_ref }}`
            **Link:** ${{ github.event.pull_request.html_url }}

            Code integrated successfully.
          embed-color: 3066993


      # -----------------------------
      # 5) PR Closed (Not Merged)
      # -----------------------------
      - name: Notify on PR Closed Without Merge
        if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == false
        uses: tsickert/discord-webhook@v5.3.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK }}
          embed-title: "❌ Pull Request Closed"
          embed-description: |
            **Title:** ${{ github.event.pull_request.title }}
            **Author:** ${{ github.event.pull_request.user.login }}
            **Link:** ${{ github.event.pull_request.html_url }}

            PR was closed without merging.
          embed-color: 15158332
