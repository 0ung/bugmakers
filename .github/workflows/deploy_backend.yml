name: Backend Deploy

on:
  pull_request:
    types: [closed]
    branches: ["dev", "main"]
    paths:
      - "backend/**"
  workflow_dispatch:

concurrency:
  group: backend-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set environment by branch
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BRANCH="${{ github.base_ref }}"
          else
            BRANCH="${{ github.ref_name }}"
          fi

          if [ "$BRANCH" = "dev" ]; then
            echo "APP_PROFILE=dev" >> $GITHUB_ENV
            echo "APP_PORT=8080" >> $GITHUB_ENV
            echo "CONTAINER_NAME=backend-dev" >> $GITHUB_ENV

            echo "HOST_DOMAIN=${{ secrets.HOST_DOMAIN_DEV }}" >> $GITHUB_ENV
            echo "DB_URL=${{ secrets.DEV_DB_URL }}" >> $GITHUB_ENV
            echo "DB_USERNAME=${{ secrets.DEV_DB_USERNAME }}" >> $GITHUB_ENV
            echo "DB_PASSWORD=${{ secrets.DEV_DB_PASSWORD }}" >> $GITHUB_ENV
          elif [ "$BRANCH" = "main" ]; then
            echo "APP_PROFILE=prod" >> $GITHUB_ENV
            echo "APP_PORT=8081" >> $GITHUB_ENV
            echo "CONTAINER_NAME=backend-prod" >> $GITHUB_ENV

            echo "HOST_DOMAIN=${{ secrets.HOST_DOMAIN_PROD }}" >> $GITHUB_ENV
            echo "DB_URL=${{ secrets.PROD_DB_URL }}" >> $GITHUB_ENV
            echo "DB_USERNAME=${{ secrets.PROD_DB_USERNAME }}" >> $GITHUB_ENV
            echo "DB_PASSWORD=${{ secrets.PROD_DB_PASSWORD }}" >> $GITHUB_ENV
          else
            echo "Unknown branch: $BRANCH"
            exit 1
          fi

          echo "===== BRANCH CONFIG ====="
          echo "BRANCH = $BRANCH"
          echo "PROFILE = $APP_PROFILE"
          echo "PORT = $APP_PORT"
          echo "NAME = $CONTAINER_NAME"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Backend
        working-directory: backend
        run: |
          chmod +x gradlew
          ./gradlew clean build -x test

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Image
        run: |
          IMAGE_REPO="ungyoung/backend"
          IMAGE_TAG="$(date +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}"
          IMAGE_FULL="${IMAGE_REPO}:${IMAGE_TAG}"

          echo "IMAGE_FULL=${IMAGE_FULL}" >> $GITHUB_ENV

          docker build -t "${IMAGE_FULL}" -f backend/Dockerfile backend
          docker push "${IMAGE_FULL}"

          docker tag "${IMAGE_FULL}" "${IMAGE_REPO}:latest"
          docker push "${IMAGE_REPO}:latest"

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_FULL: ${{ env.IMAGE_FULL }}
          APP_PROFILE: ${{ env.APP_PROFILE }}
          APP_PORT: ${{ env.APP_PORT }}
          CONTAINER_NAME: ${{ env.CONTAINER_NAME }}

          # secret-derived runtime config
          DB_URL: ${{ env.DB_URL }}
          DB_USERNAME: ${{ env.DB_USERNAME }}
          DB_PASSWORD: ${{ env.DB_PASSWORD }}
          HOST_DOMAIN: ${{ env.HOST_DOMAIN }}

          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          KAKAO_CLIENT_ID: ${{ secrets.KAKAO_CLIENT_ID }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          NEWS_CRAWLER_API_KEY: ${{ secrets.NEWS_CRAWLER_API_KEY }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: IMAGE_FULL,APP_PROFILE,APP_PORT,CONTAINER_NAME,DB_URL,DB_USERNAME,DB_PASSWORD,HOST_DOMAIN,GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET,NAVER_CLIENT_ID,NAVER_CLIENT_SECRET,KAKAO_CLIENT_ID,KAKAO_CLIENT_SECRET,JWT_SECRET,NEWS_CRAWLER_API_KEY
          command_timeout: 15m
          script: |
            set -euo pipefail

            echo "Deploying image: $IMAGE_FULL"
            echo "Profile: $APP_PROFILE"
            echo "Port: $APP_PORT"
            echo "Container: $CONTAINER_NAME"

            docker pull "$IMAGE_FULL"

            docker stop "$CONTAINER_NAME" || true
            docker rm "$CONTAINER_NAME" || true

            docker network create dev-net >/dev/null 2>&1 || true

            COMMON_ENVS=(
              -e "SPRING_PROFILES_ACTIVE=$APP_PROFILE"
              -e "GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID"
              -e "GOOGLE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET"
              -e "NAVER_CLIENT_ID=$NAVER_CLIENT_ID"
              -e "NAVER_CLIENT_SECRET=$NAVER_CLIENT_SECRET"
              -e "KAKAO_CLIENT_ID=$KAKAO_CLIENT_ID"
              -e "KAKAO_CLIENT_SECRET=$KAKAO_CLIENT_SECRET"
              -e "JWT_SECRET=$JWT_SECRET"
              -e "HOST_DOMAIN=$HOST_DOMAIN"
              -e "NEWS_CRAWLER_API_KEY=$NEWS_CRAWLER_API_KEY"
            )

            if [ "$APP_PROFILE" = "dev" ]; then
              echo "Injecting DEV DB envs"
              docker run -d \
                --name "$CONTAINER_NAME" \
                --network dev-net \
                --restart always \
                -p "${APP_PORT}:8080" \
                "${COMMON_ENVS[@]}" \
                -e "DEV_DB_URL=$DB_URL" \
                -e "DEV_DB_USERNAME=$DB_USERNAME" \
                -e "DEV_DB_PASSWORD=$DB_PASSWORD" \
                "$IMAGE_FULL"
            else
              echo "Injecting PROD DB envs"
              docker run -d \
                --name "$CONTAINER_NAME" \
                --network dev-net \
                --restart always \
                -p "${APP_PORT}:8080" \
                "${COMMON_ENVS[@]}" \
                -e "PROD_DB_URL=$DB_URL" \
                -e "PROD_DB_USERNAME=$DB_USERNAME" \
                -e "PROD_DB_PASSWORD=$DB_PASSWORD" \
                "$IMAGE_FULL"
            fi

            echo "Waiting for container to stabilize..."
            sleep 3

            if ! docker ps --format '{{.Names}}' | grep -q "^${CONTAINER_NAME}$"; then
              echo "❌ Container is not running. Showing last logs:"
              docker logs --tail 200 "$CONTAINER_NAME" || true
              echo "Inspect:"
              docker inspect "$CONTAINER_NAME" || true
              exit 1
            fi

            echo "✅ Container is running. Recent logs:"
            docker logs --tail 80 "$CONTAINER_NAME" || true

            docker image prune -f
