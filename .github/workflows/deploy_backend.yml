name: Backend Deploy

on:
  pull_request:
    types: [closed]
    branches:
      - "dev"
      - "main"
    paths:
      - "backend/**"
  workflow_dispatch:

jobs:
  build_and_deploy:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set environment by branch
        id: env-branch
        run: |
          echo "CURRENT_BRANCH=${GITHUB_REF_NAME}"

          if [ "${GITHUB_REF_NAME}" = "dev" ]; then
            echo "APP_PROFILE=dev" >> $GITHUB_ENV
            echo "APP_PORT=8080" >> $GITHUB_ENV
            echo "CONTAINER_NAME=backend-dev" >> $GITHUB_ENV
          else
            echo "APP_PROFILE=prod" >> $GITHUB_ENV
            echo "APP_PORT=8081" >> $GITHUB_ENV
            echo "CONTAINER_NAME=backend-prod" >> $GITHUB_ENV
          fi

          echo "===== BRANCH CONFIG ====="
          echo "PROFILE = $APP_PROFILE"
          echo "PORT = $APP_PORT"
          echo "NAME = $CONTAINER_NAME"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Backend
        working-directory: backend
        run: |
          chmod +x gradlew
          ./gradlew clean build -x test

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Image
        run: |
          IMAGE_REPO="ungyoung/backend"
          IMAGE_TAG=$(date +%Y%m%d-%H%M%S)
          IMAGE_FULL="${IMAGE_REPO}:${IMAGE_TAG}"

          echo "IMAGE_FULL=${IMAGE_FULL}" >> $GITHUB_ENV

          docker build -t ${IMAGE_FULL} -f backend/Dockerfile backend
          docker push ${IMAGE_FULL}

          docker tag ${IMAGE_FULL} ${IMAGE_REPO}:latest
          docker push ${IMAGE_REPO}:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_FULL: ${{ env.IMAGE_FULL }}
          APP_PROFILE: ${{ env.APP_PROFILE }}
          APP_PORT: ${{ env.APP_PORT }}
          CONTAINER_NAME: ${{ env.CONTAINER_NAME }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: IMAGE_FULL,APP_PROFILE,APP_PORT,CONTAINER_NAME
          script: |
            echo "Deploying image: $IMAGE_FULL"
            echo "Profile: $APP_PROFILE"
            echo "Port: $APP_PORT"
            echo "Container: $CONTAINER_NAME"

            docker pull $IMAGE_FULL

            docker stop $CONTAINER_NAME || true
            docker rm $CONTAINER_NAME || true

            docker network create dev-net || true

            docker run -d \
              --name $CONTAINER_NAME \
              --network dev-net \
              --restart always \
              -p ${APP_PORT}:8080 \
              -e SPRING_PROFILES_ACTIVE=$APP_PROFILE \
              -e DEV_DB_URL="${{ secrets.DEV_DB_URL }}" \
              -e DEV_DB_USERNAME="${{ secrets.DEV_DB_USERNAME }}" \
              -e DEV_DB_PASSWORD="${{ secrets.DEV_DB_PASSWORD }}" \
              -e GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}" \
              -e GOOGLE_CLIENT_SECRET="${{ secrets.GOOGLE_CLIENT_SECRET }}" \
              -e NAVER_CLIENT_ID="${{ secrets.NAVER_CLIENT_ID }}" \
              -e NAVER_CLIENT_SECRET="${{ secrets.NAVER_CLIENT_SECRET }}" \
              -e KAKAO_CLIENT_ID="${{ secrets.KAKAO_CLIENT_ID }}" \
              -e KAKAO_CLIENT_SECRET="${{ secrets.KAKAO_CLIENT_SECRET }}" \
              -e JWT_SECRET="${{ secrets.JWT_SECRET }}" \
              -e HOST_DOMAIN="${{ secrets.HOST_DOMAIN_DEV }}" \
              -e NEWS_CRAWLER_API_KEY="${{ secrets.NEWS_CRAWLER_API_KEY }}" \
              $IMAGE_FULL

            docker image prune -f
