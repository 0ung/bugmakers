name: Frontend DEV Deploy

on:
  pull_request:
    types: [closed]
    branches:
      - "dev"
    paths:
      - "frontend/**"

jobs:
  build_and_deploy:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # (선택 사항) Docker Build 안에서 npm install을 하므로
      # 여기서 굳이 Node 세팅하고 빌드할 필요가 없어졌습니다. (시간 절약)

      - name: Login Docker Hub
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login \
            -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build & Push Image
        # Dockerfile이 frontend 폴더 안에 있으므로 working-directory 설정은 안 해도 되지만
        # docker build 명령에서 경로를 잘 지정해야 합니다.
        run: |
          # 1. 소문자 변환 및 공백 제거 (안전장치)
          DOCKER_USER=$(echo "$RAW_USER" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]' | cut -d'@' -f1)

          # 2. 이미지 이름 설정
          IMAGE_REPO="${DOCKER_USER}/frontend-dev"

          # 3. 타임스탬프 태그 생성 (롤백용)
          IMAGE_TAG=$(date +%Y%m%d-%H%M%S)
          IMAGE_FULL="${IMAGE_REPO}:${IMAGE_TAG}"

          echo "Building image: ${IMAGE_FULL}"

          # 4. Docker 빌드 (컨텍스트: ./frontend)
          # Dockerfile 위치가 frontend/Dockerfile 이므로 -f 옵션 없이 context만 지정해도 됨
          docker build -t ${IMAGE_FULL} ./frontend
          docker push ${IMAGE_FULL}

          # latest 태그도 업데이트
          docker tag ${IMAGE_FULL} ${IMAGE_REPO}:latest
          docker push ${IMAGE_REPO}:latest

          # 5. 환경변수 저장
          echo "IMAGE_FULL=${IMAGE_FULL}" >> $GITHUB_ENV

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        env:
          IMAGE_FULL: ${{ env.IMAGE_FULL }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: IMAGE_FULL # 필수: 변수 전달
          script: |
            echo "Deploying version: $IMAGE_FULL"

            # 1. 이미지 Pull
            docker pull $IMAGE_FULL

            # 2. 기존 컨테이너 삭제
            docker stop frontend-dev || true
            docker rm frontend-dev || true

            # 3. 네트워크 생성
            docker network create dev-net || true

            # 4. 컨테이너 실행
            # Nginx 기본 포트는 80이므로 -p 8082:80 사용 (외부 8082 -> 내부 80)
            docker run -d \
              --name frontend-dev \
              --network dev-net \
              --restart always \
              -p 8082:80 \
              -v /home/ubuntu/nginx/dev/nginx.conf:/etc/nginx/nginx.conf:ro \
              -v /home/ubuntu/app/frontend/logs:/var/log/nginx \
              $IMAGE_FULL
