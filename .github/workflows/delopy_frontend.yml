name: Frontend DEV Deploy

on:
  pull_request:
    types: [closed]
    branches:
      - "dev"
    paths: 
      - "frontend/**"

jobs:
  build_and_deploy:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build
        run: |
          npm install
          npm run build

      - name: Docker Login
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login \
            -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build & Push
        env:
          IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/frontend-dev
        run: |
          docker build -t ${IMAGE_NAME}:latest .
          docker push ${IMAGE_NAME}:latest
          echo "IMAGE_FULL=${IMAGE_NAME}:latest" >> $GITHUB_ENV

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            docker pull $IMAGE_FULL
            docker stop frontend-dev || true
            docker rm frontend-dev || true

            docker network create dev-net || true

            docker run -d \
              --name frontend-dev \
              --network dev-net \
              -p 8082:8080 \
              -v /home/ubuntu/nginx/dev/nginx.conf:/etc/nginx/nginx.conf:ro \
              -v /home/ubuntu/app/frontend/logs:/var/log/nginx \
              $IMAGE_FULL
