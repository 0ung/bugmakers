name: Frontend DEV Deploy

on:
  pull_request:
    types: [closed]
    branches:
      - "dev"
    paths:
      - "frontend/**"

jobs:
  build_and_deploy:
    # PR이 'Merge' 된 경우에만 실행 (닫기만 했을 땐 실행 X)
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 1. frontend 폴더로 이동해서 빌드
      - name: Build
        working-directory: ./frontend
        run: |
          npm install
          npm run build

      - name: Docker Login
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login \
            -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      # 2. Docker 빌드 컨텍스트를 ./frontend 로 지정
      - name: Build & Push
        env:
          IMAGE_NAME: frontend-dev
        run: |
          # Dockerfile이 frontend 폴더 안에 있으므로 경로 지정
          docker build -t ${IMAGE_NAME}:latest ./frontend
          docker push ${IMAGE_NAME}:latest
          echo "IMAGE_FULL=${IMAGE_NAME}:latest" >> $GITHUB_ENV

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        env:
          IMAGE_FULL: ${{ env.IMAGE_FULL }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: IMAGE_FULL # 3. SSH 스크립트로 변수 전달
          script: |
            echo "Deploying image: $IMAGE_FULL"

            # 최신 이미지 Pull
            docker pull $IMAGE_FULL

            # 기존 컨테이너 정리
            docker stop frontend-dev || true
            docker rm frontend-dev || true

            # 네트워크 생성 (없으면 생성)
            docker network create dev-net || true

            # 컨테이너 실행
            # (주의: nginx.conf 파일이 EC2 서버의 해당 경로에 있어야 합니다)
            docker run -d \
              --name frontend-dev \
              --network dev-net \
              -p 8082:80 \
              -v /home/ubuntu/nginx/dev/nginx.conf:/etc/nginx/nginx.conf:ro \
              -v /home/ubuntu/app/frontend/logs:/var/log/nginx \
              $IMAGE_FULL
