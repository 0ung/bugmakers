name: Frontend Deploy

on:
  pull_request:
    types: [closed]
    branches:
      - "dev"
      - "main"
    paths:
      - "frontend/**"
  workflow_dispatch:

jobs:
  build_and_deploy:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # === Branch 기반 profile, port, container, nginx, log 경로 자동 설정 ===
      - name: Set environment by branch
        id: env-branch
        run: |
          echo "CURRENT BRANCH = ${GITHUB_REF_NAME}"

          if [ "${GITHUB_REF_NAME}" = "dev" ]; then
            echo "APP_PROFILE=dev" >> $GITHUB_ENV
            echo "APP_PORT=100" >> $GITHUB_ENV
            echo "CONTAINER_NAME=frontend-dev" >> $GITHUB_ENV
            echo "NGINX_CONF=/home/ubuntu/nginx/dev/nginx.conf" >> $GITHUB_ENV
            echo "LOG_DIR=/home/ubuntu/app/frontend/dev/logs" >> $GITHUB_ENV
          else
            echo "APP_PROFILE=prod" >> $GITHUB_ENV
            echo "APP_PORT=101" >> $GITHUB_ENV
            echo "CONTAINER_NAME=frontend-prod" >> $GITHUB_ENV
            echo "NGINX_CONF=/home/ubuntu/nginx/prod/nginx.conf" >> $GITHUB_ENVd
            echo "LOG_DIR=/home/ubuntu/app/frontend/prod/logs" >> $GITHUB_ENV
          fi

          echo "===== BRANCH CONFIG ====="
          echo "PROFILE     = $APP_PROFILE"
          echo "PORT        = $APP_PORT"
          echo "CONTAINER   = $CONTAINER_NAME"
          echo "NGINX_CONF  = $NGINX_CONF"
          echo "LOG_DIR     = $LOG_DIR"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set API URL by branch
        run: |
          if [ "${{ env.APP_PROFILE }}" = "dev" ]; then
            echo "VITE_API_URL=${{ secrets.VITE_API_BASE_URL_DEV }}" >> $GITHUB_ENV
          else
            echo "VITE_API_URL=${{ secrets.VITE_API_BASE_URL_PROD }}" >> $GITHUB_ENV
          fi

      - name: Build & Push Image
        run: |
          IMAGE_REPO="ungyoung/frontend"
          IMAGE_TAG=$(date +%Y%m%d-%H%M%S)
          IMAGE_FULL="${IMAGE_REPO}:${IMAGE_TAG}"

          echo "IMAGE_FULL=${IMAGE_FULL}" >> $GITHUB_ENV

          docker build \
            --build-arg VITE_API_BASE_URL=${{ env.VITE_API_URL }} \
            -t ${IMAGE_FULL} ./frontend
          docker push ${IMAGE_FULL}

          docker tag ${IMAGE_FULL} ${IMAGE_REPO}:latest
          docker push ${IMAGE_REPO}:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_FULL: ${{ env.IMAGE_FULL }}
          APP_PROFILE: ${{ env.APP_PROFILE }}
          APP_PORT: ${{ env.APP_PORT }}
          CONTAINER_NAME: ${{ env.CONTAINER_NAME }}
          NGINX_CONF: ${{ env.NGINX_CONF }}
          LOG_DIR: ${{ env.LOG_DIR }}

        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: IMAGE_FULL,APP_PROFILE,APP_PORT,CONTAINER_NAME,NGINX_CONF,LOG_DIR
          script: |
            echo "Deploying image: $IMAGE_FULL"
            echo "Container: $CONTAINER_NAME"
            echo "Port: $APP_PORT"
            echo "Logs: $LOG_DIR"

            docker pull $IMAGE_FULL

            docker stop $CONTAINER_NAME || true
            docker rm $CONTAINER_NAME || true

            docker network create dev-net || true

            # 로그 디렉토리 생성
            mkdir -p $LOG_DIR

            docker run -d \
              --name $CONTAINER_NAME \
              --network dev-net \
              --restart always \
              -p ${APP_PORT}:80 \
              -v ${NGINX_CONF}:/etc/nginx/nginx.conf:ro \
              -v $LOG_DIR:/var/log/nginx \
              $IMAGE_FULL

            docker image prune -f
