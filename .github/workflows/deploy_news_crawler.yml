name: News Crawler Deploy

on:
  pull_request:
    types: [closed]
    branches:
      - "dev"
      - "main"
    paths:
      - "scripts/news-crawler/**"
  workflow_dispatch:

jobs:
  build_and_deploy:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set environment by branch
        id: env-branch
        run: |
          if [ "${GITHUB_REF_NAME}" = "dev" ]; then
            echo "APP_ENV=dev" >> $GITHUB_ENV
            echo "CONTAINER_NAME=news-crawler-dev" >> $GITHUB_ENV
            echo "GRPC_SERVER=backend-dev:50051" >> $GITHUB_ENV
          else
            echo "APP_ENV=prod" >> $GITHUB_ENV
            echo "CONTAINER_NAME=news-crawler-prod" >> $GITHUB_ENV
            echo "GRPC_SERVER=backend-prod:50051" >> $GITHUB_ENV
          fi

          echo "===== BRANCH CONFIG ====="
          echo "ENV = $APP_ENV"
          echo "NAME = $CONTAINER_NAME"
          echo "GRPC = $GRPC_SERVER"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Image
        run: |
          IMAGE_REPO="ungyoung/news-crawler"
          IMAGE_TAG=$(date +%Y%m%d-%H%M%S)
          IMAGE_FULL="${IMAGE_REPO}:${IMAGE_TAG}"

          echo "IMAGE_FULL=${IMAGE_FULL}" >> $GITHUB_ENV

          docker build -t ${IMAGE_FULL} -f scripts/news-crawler/Dockerfile scripts/news-crawler
          docker push ${IMAGE_FULL}

          docker tag ${IMAGE_FULL} ${IMAGE_REPO}:latest
          docker push ${IMAGE_REPO}:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_FULL: ${{ env.IMAGE_FULL }}
          APP_ENV: ${{ env.APP_ENV }}
          CONTAINER_NAME: ${{ env.CONTAINER_NAME }}
          GRPC_SERVER: ${{ env.GRPC_SERVER }}
          API_KEY: ${{ secrets.NEWS_CRAWLER_API_KEY }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: IMAGE_FULL,APP_ENV,CONTAINER_NAME,GRPC_SERVER,API_KEY
          script: |
            echo "Deploying image: $IMAGE_FULL"
            echo "Env: $APP_ENV"
            echo "Container: $CONTAINER_NAME"
            echo "gRPC Server: $GRPC_SERVER"

            docker pull $IMAGE_FULL

            docker stop $CONTAINER_NAME || true
            docker rm $CONTAINER_NAME || true

            docker network create dev-net || true

            docker run -d \
              --name $CONTAINER_NAME \
              --network dev-net \
              --restart always \
              -e ENVIRONMENT=$APP_ENV \
              -e NEWS_CRAWLER_API_KEY="$API_KEY" \
              -e GRPC_SERVER=$GRPC_SERVER \
              $IMAGE_FULL

            docker image prune -f
