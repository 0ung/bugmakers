name: News Crawler Deploy

on:
  pull_request:
    types: [closed]
    branches: ["dev", "main"]
    paths:
      - "scripts/news-crawler/**"
  workflow_dispatch:

concurrency:
  group: news-crawler-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set environment by branch
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BRANCH="${{ github.base_ref }}"
          else
            BRANCH="${{ github.ref_name }}"
          fi

          if [ "$BRANCH" = "dev" ]; then
            echo "APP_ENV=dev" >> $GITHUB_ENV
            echo "CONTAINER_NAME=news-crawler-dev" >> $GITHUB_ENV
            echo "GRPC_SERVER=backend-dev:50051" >> $GITHUB_ENV
          elif [ "$BRANCH" = "main" ]; then
            echo "APP_ENV=prod" >> $GITHUB_ENV
            echo "CONTAINER_NAME=news-crawler-prod" >> $GITHUB_ENV
            echo "GRPC_SERVER=backend-prod:50051" >> $GITHUB_ENV
          else
            echo "Unknown branch: $BRANCH"
            exit 1
          fi

          echo "===== BRANCH CONFIG ====="
          echo "BRANCH = $BRANCH"
          echo "APP_ENV = $APP_ENV"
          echo "CONTAINER_NAME = $CONTAINER_NAME"
          echo "GRPC_SERVER = $GRPC_SERVER"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Image
        run: |
          IMAGE_REPO="ungyoung/news-crawler"
          IMAGE_TAG="$(date +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}"
          IMAGE_FULL="${IMAGE_REPO}:${IMAGE_TAG}"

          echo "IMAGE_FULL=${IMAGE_FULL}" >> $GITHUB_ENV

          docker build -t "${IMAGE_FULL}" \
            -f scripts/news-crawler/Dockerfile scripts/news-crawler

          docker push "${IMAGE_FULL}"

          docker tag "${IMAGE_FULL}" "${IMAGE_REPO}:latest"
          docker push "${IMAGE_REPO}:latest"

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_FULL: ${{ env.IMAGE_FULL }}
          APP_ENV: ${{ env.APP_ENV }}
          CONTAINER_NAME: ${{ env.CONTAINER_NAME }}
          GRPC_SERVER: ${{ env.GRPC_SERVER }}
          API_KEY: ${{ secrets.NEWS_CRAWLER_API_KEY }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: IMAGE_FULL,APP_ENV,CONTAINER_NAME,GRPC_SERVER,API_KEY
          command_timeout: 15m
          script: |
            set -euo pipefail

            echo "Deploying image: $IMAGE_FULL"
            echo "Env: $APP_ENV"
            echo "Container: $CONTAINER_NAME"
            echo "gRPC Server: $GRPC_SERVER"

            docker pull "$IMAGE_FULL"

            # stop/remove old
            docker stop "$CONTAINER_NAME" || true
            docker rm "$CONTAINER_NAME" || true

            # network
            docker network create dev-net >/dev/null 2>&1 || true

            # run new
            docker run -d \
              --name "$CONTAINER_NAME" \
              --network dev-net \
              --restart always \
              -e ENVIRONMENT="$APP_ENV" \
              -e NEWS_CRAWLER_API_KEY="$API_KEY" \
              -e GRPC_SERVER="$GRPC_SERVER" \
              "$IMAGE_FULL"

            # ---- IMPORTANT: Java "배포하면 안 됨" 방지용 즉시 체크 ----
            echo "Waiting for container to stabilize..."
            sleep 3

            if ! docker ps --format '{{.Names}}' | grep -q "^${CONTAINER_NAME}$"; then
              echo "❌ Container is not running. Showing last logs:"
              docker logs --tail 200 "$CONTAINER_NAME" || true
              echo "Inspect:"
              docker inspect "$CONTAINER_NAME" || true
              exit 1
            fi

            echo "✅ Container is running. Recent logs:"
            docker logs --tail 50 "$CONTAINER_NAME" || true

            docker image prune -f
