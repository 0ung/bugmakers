name: Backend DEV Deploy

on:
  pull_request:
    types: [closed]
    branches:
      - "dev"
    paths:
      - "backend/**"

jobs:
  build_and_deploy:
    # PR이 Merge 된 경우에만 실행
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: "17" # 요청하신 Java 17
          distribution: "temurin"

      - name: Build with Gradle
        working-directory: ./backend
        run: |
          chmod +x gradlew
          ./gradlew clean build -x test

      - name: Login Docker Hub
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login \
            -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build & Push Image
        working-directory: ./backend
        run: |
          # 1. 소문자 변환 및 공백 제거 (안전장치)
          DOCKER_USER=$(echo "${{ secrets.DOCKER_USERNAME }}" | tr '[:upper:]' '[:lower:]' | tr -d ' ')
          IMAGE_NAME="${DOCKER_USER}/backend-dev"

          echo "Building image: ${IMAGE_NAME}:latest"

          # 2. Dockerfile 빌드 (현재 위치 ./backend)
          docker build -t ${IMAGE_NAME}:latest .
          docker push ${IMAGE_NAME}:latest

          # 3. 환경변수 저장
          echo "IMAGE_FULL=${IMAGE_NAME}:latest" >> $GITHUB_ENV

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        env:
          IMAGE_FULL: ${{ env.IMAGE_FULL }}
          # 필요한 환경변수를 envs로 넘기기 위해 세팅
          DB_URL: ${{ secrets.DEV_DB_URL }}
          DB_USER: ${{ secrets.DEV_DB_USER }}
          DB_PASSWORD: ${{ secrets.DEV_DB_PASSWORD }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: IMAGE_FULL,DB_URL,DB_USER,DB_PASSWORD
          script: |
            echo "Deploying $IMAGE_FULL..."

            # 1. 최신 이미지 받기
            docker pull $IMAGE_FULL

            # 2. 기존 컨테이너 삭제
            docker stop backend-dev || true
            docker rm backend-dev || true

            # 3. 네트워크 생성 (중요: 프론트와 통신하기 위해 필수)
            docker network create dev-net || true

            # 4. Docker Run (환경변수 주입)
            docker run -d \
              --name backend-dev \
              --network dev-net \
              --restart always \
              -p 8080:8080 \
              -e SPRING_PROFILES_ACTIVE=DEV \
              -e DB_URL="$DB_URL" \
              -e DB_USER="$DB_USER" \
              -e DB_PASSWORD="$DB_PASSWORD" \
              -v /home/ubuntu/app/backend/logs:/logs \
              $IMAGE_FULL
