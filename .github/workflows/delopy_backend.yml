name: Backend DEV Deploy

on:
  pull_request:
    types: [closed]
    branches:
      - "dev"
    paths: 
      - "backend/**"
jobs:
  
  build_and_deploy:
    
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew clean build -x test

      - name: Login Docker Hub
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login \
            -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build & Push Image
        env:
          IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/backend-dev
        run: |
          docker build -t ${IMAGE_NAME}:latest .
          docker push ${IMAGE_NAME}:latest
          echo "IMAGE_FULL=${IMAGE_NAME}:latest" >> $GITHUB_ENV

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            docker pull $IMAGE_FULL
            docker stop backend-dev || true
            docker rm backend-dev || true

            docker network create dev-net || true

            docker run -d \
              --name backend-dev \
              --network dev-net \
              -e SPRING_PROFILES_ACTIVE=DEV \
              -e SPRING_PROFILES_ACTIVE=DEV \
              -e DB_URL="${{ secrets.DEV_DB_URL }}" \
              -e DB_USER="${{ secrets.DEV_DB_USER }}" \
              -e DB_PASSWORD="${{ secrets.DEV_DB_PASSWORD }}" \
              -v /home/ubuntu/app/backend/logs:/logs \
              $IMAGE_FULL
